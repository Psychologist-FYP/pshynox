[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pshynox-api"
version = "0.1.0"
description = "Offline Module C clinical documentation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
    "rank-bm25>=0.2.2,<0.3",
    "scikit-learn>=1.6,<2",
    # TURN credential requests for internet meetings (approved 8 Nov 2026).
    "httpx>=0.27,<1",
    # English speech recognition: Parakeet TDT 0.6B v2 through ONNX Runtime, CPU build (approved 11 Nov 2026;
    # docs/ASR_MODELS.md). The GPU build is onnxruntime-gpu, installed instead of onnxruntime when wanted.
    "onnxruntime>=1.31,<2",
    "onnx-asr>=0.12,<0.13",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=3.3,<6",
]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["services*"]
